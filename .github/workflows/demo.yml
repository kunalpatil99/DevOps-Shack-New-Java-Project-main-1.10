
name: My first github actions workflow

on:
  workflow_dispatch:

env:
  APP_NAME: DevOps-Shack-App

jobs:
  test:
      runs-on: ubuntu-latest
  
      steps:
        - name: Test
          run: |
            echo "Testing Application..."
            sleep 5
            
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Build
        run: |
          echo "Building Application..."
          sleep 5

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: deploy
        run: |
          echo "Building Application..."
          sleep 5
